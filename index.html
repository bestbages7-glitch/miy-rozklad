<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Навігаційна панель -->
  <header class="bg-slate-800/90 backdrop-blur sticky top-0 z-30 border-b border-slate-700 px-4 py-3 shadow-md">

          <i class="fa-solid fa-graduation-cap"></i> Розклад

        <p id="group-subtitle" class="text-xs text-slate-400">Оберіть групу</p>

      <div class="flex items-center gap-1.5 sm:gap-2">

    <!-- БЛОК: Оголошення -->

    <!-- Банер встановлення PWA -->
    <div id="install-banner" class="hidden bg-blue-900/40 border border-blue-500/40 rounded-xl p-3 flex items-center justify-between gap-3 text-xs sm:text-sm">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-mobile-screen-button text-blue-400 text-lg"></i>
        <span id="install-text">Встановіть «Мій розклад» на головний екран!</span>

    <!-- Перемикач тижня та днів -->

        <button id="week-1-btn" class="flex-1 py-1.5 text-xs font-semibold rounded-lg transition-colors text-slate-400">

    <!-- Список занять / сесії / канікул / практики -->

      <div class="text-center py-12 text-slate-500">
        <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2"></i>
        <p>Завантаження розкладу...</p>
      </div>

  </main>

  <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-800">
    Синхронізовано з Google Таблицею • Хмарні сповіщення OneSignal
  </footer>

  <script>
    const SHEET_ID = '1igLEwYbzJ_ucINolekByzD_wL7pAnU-nDCbSiUciSMA';

    const DEFAULT_GROUPS = [
      'БС-5.203к', 'БС-5.201', 'БС-5.202к', 'БС-6.101', 'БС-6.102к',
      'БС-6.103к', 'БС-6.104к', 'СТ-6.105', 'СТ-6.106к', 'СТ-6.107к',
      'МН-6.108к', 'МН-6.109к', 'СТ-5.205', 'СТ-5.206к', 'СТ-5.207к',
      'МН-5.208к', 'МН-5.209к', 'ЕМ-6.110', 'ЕМ-6.111к', 'ТМ-6.112',
      'ХТ-6.113', 'ТМ-6.114к', 'ТМ-6.115к', 'ТР-6.116к', 'ТР-6.117к',
      'ЕМ-5.210', 'ЕМ-5.211к', 'ТМ-5.212', 'ХТ-5.213', 'ТМ-5.214к',
      'ТМ-5.215к', 'ТР-5.216', 'ТР-5.217к'
    ];

    const DAYS = [
      { id: 'Пн', name: 'Понеділок' },
      { id: 'Вт', name: 'Вівторок' },
      { id: 'Ср', name: 'Середа' },
      { id: 'Чт', name: 'Четвер' },
      { id: 'Пт', name: "П'ятниця" }
    ];

    let semesterSettings = {
      semester: "1",
      startDate: new Date('2026-09-01T00:00:00'),
      changeDay: "Вівторок"
    };

    let groupStatusData = {}; // Карта { "БС-5.203к": { status: "навчання", msg: "..." } }
    let GROUPS = [...DEFAULT_GROUPS];
    let currentGroup = localStorage.getItem('selected_group') || 'БС-5.203к';
    let currentDay = getInitialDay();
    let currentWeek = 1;
    let scheduleData = [];
    let sessionData = [];
    let replacementsData = {};
    let currentAnnouncement = null;
    let deferredPrompt;

    function getInitialDay() {
      const d = new Date().getDay();
      return (d >= 1 && d <= 5) ? DAYS[d - 1].id : 'Пн';
    }

    function parseWeekdayNameToIndex(name) {
      if (!name) return 0;
      const n = String(name).trim().toLowerCase();
      if (n.startsWith('вт')) return 1;
      if (n.startsWith('ср')) return 2;
      if (n.startsWith('чт')) return 3;
      if (n.startsWith('пт')) return 4;
      if (n.startsWith('сб')) return 5;
      if (n.startsWith('нд')) return 6;
      return 0;
    }

    function parseCustomDate(val) {
      if (!val) return null;
      const str = String(val).trim();
      if (str.includes('.')) {
        const p = str.split('.');
        if (p.length === 3) return new Date(Number(p[2]), Number(p[1]) - 1, Number(p[0]));
      }
      if (str.includes('-')) {
        const p = str.split('-');
        if (p.length === 3) return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
      }
      return null;
    }

    function calculateCurrentWeek() {
      const now = new Date();
      now.setHours(0, 0, 0, 0);

      const start = new Date(semesterSettings.startDate);
      start.setHours(0, 0, 0, 0);

      if (now < start) return 1;

      const startDayIdx = (start.getDay() + 6) % 7;
      const changeDayIdx = parseWeekdayNameToIndex(semesterSettings.changeDay);

      let daysToFirstRollover = (changeDayIdx - startDayIdx) % 7;
      if (daysToFirstRollover <= 0) daysToFirstRollover += 7;

      const firstRollover = new Date(start);
      firstRollover.setDate(start.getDate() + daysToFirstRollover);

      if (now < firstRollover) {
        return 1;
      } else {
        const diffDays = Math.floor((now - firstRollover) / (1000 * 60 * 60 * 24));
        const cycle = Math.floor(diffDays / 7);
        const weekNum = 2 + cycle;
        return (weekNum % 2 === 0) ? 2 : 1;
      }
    }

    function getCurrentGroupStatus() {
      const g = groupStatusData[currentGroup.toLowerCase()];
      return g ? g.status : "навчання";
    }

    function getCurrentGroupMessage() {
      const g = groupStatusData[currentGroup.toLowerCase()];
      return g ? g.msg : "";
    }

    function isPairCurrent(item) {
      if (getCurrentGroupStatus() !== 'навчання') return false;

      const dayIndex = new Date().getDay();
      const realTodayMap = ['Нд', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
      const realTodayId = realTodayMap[dayIndex];
      
      if (currentDay !== realTodayId || item.day.toLowerCase() !== realTodayId.toLowerCase()) {
        return false;
      }

      const realWeek = calculateCurrentWeek();
      if (currentWeek !== realWeek) return false;
      if (item.week && item.week !== 'Всі' && item.week != realWeek) return false;

      if (!item.time) return false;
      const normalizedTime = item.time.replace(/[–—]/g, '-');
      if (!normalizedTime.includes('-')) return false;

      try {
        const parts = normalizedTime.split('-').map(t => t.trim());
        if (parts.length !== 2) return false;

        const [startH, startM] = parts[0].split(':').map(Number);
        const [endH, endM] = parts[1].split(':').map(Number);

        if (isNaN(startH) || isNaN(startM) || isNaN(endH) || isNaN(endM)) return false;

        const now = new Date();
        const currentMinutes = now.getHours() * 60 + now.getMinutes();
        return currentMinutes >= (startH * 60 + startM) && currentMinutes <= (endH * 60 + endM);
      } catch (e) {
        return false;
      }
    }

    // ЗЧИТУВАННЯ ГРУП, ІНДИВІДУАЛЬНИХ СТАТУСІВ ТА ПАРАМЕТРІВ СЕМЕСТРУ
    async function loadGroupsAndMode() {
      const select = document.getElementById('group-select');
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent('Групи')}&t=${Date.now()}`;
      
      try {
        const res = await fetch(url);
        if (res.ok) {
          const text = await res.text();
          const parsed = parseCsvSafe(text);
          const parsedGroups = [];
          groupStatusData = {};

          parsed.forEach((cols, idx) => {
            if (cols[0]) {
              const val = cols[0].trim();
              if (val.length > 0 && val.toLowerCase() !== 'назва групи' && val.toLowerCase() !== 'групи') {
                parsedGroups.push(val);
                // Зчитуємо стовпчик B (статус) та C (повідомлення)
                const status = cols[1] ? cols[1].trim().toLowerCase() : "навчання";
                const msg = cols[2] ? cols[2].trim() : "";
                groupStatusData[val.toLowerCase()] = { status: status || "навчання", msg: msg };
              }
            }
          });

          // Налаштування семестру: F2, G2, H2 (індекси 5, 6, 7)
          if (parsed.length > 1) {
            const r2 = parsed[1];
            if (r2[5]) semesterSettings.semester = r2[5].trim();
            if (r2[6]) {
              const pDate = parseCustomDate(r2[6]);
              if (pDate) semesterSettings.startDate = pDate;
            }
            if (r2[7]) semesterSettings.changeDay = r2[7].trim();
          }

          if (parsedGroups.length > 0) GROUPS = parsedGroups;
        }
      } catch (e) {
        console.warn("Помилка завантаження аркуша груп:", e);
      }

      currentWeek = calculateCurrentWeek();
      setWeek(currentWeek);

      const urlParams = new URLSearchParams(window.location.search);
      const groupFromUrl = urlParams.get('group');

      if (groupFromUrl && GROUPS.includes(groupFromUrl)) {
        currentGroup = groupFromUrl;
      } else if (!GROUPS.includes(currentGroup)) {
        currentGroup = GROUPS[0];
      }

      localStorage.setItem('selected_group', currentGroup);
      select.innerHTML = GROUPS.map(g => `<option value="${g}" ${g === currentGroup ? 'selected' : ''}>${g}</option>`).join('');

      updateManifest(currentGroup);
      applyModeAndFetch();
    }

    function updateManifest(groupName) {
      const title = `Мій розклад ${groupName}`;
      document.title = title;
      const appTitleElem = document.getElementById('app-title');
      if (appTitleElem) appTitleElem.innerHTML = `<i class="fa-solid fa-graduation-cap"></i> ${title}`;
      const groupSubElem = document.getElementById('group-subtitle');
      if (groupSubElem) {
        groupSubElem.textContent = `Група: ${groupName} • ${semesterSettings.semester ? `${semesterSettings.semester} семестр` : ''}`;
      }

      const manifest = {
        name: title,
        short_name: groupName,
        start_url: window.location.href.split('?')[0] + `?group=${encodeURIComponent(groupName)}`,
        display: "standalone",
        background_color: "#0f172a",
        theme_color: "#1e293b",
        icons: [{
          src: "https://cdn-icons-png.flaticon.com/512/2997/2997295.png",
          sizes: "512x512",
          type: "image/png",
          purpose: "any maskable"
        }]
      };
      const stringManifest = JSON.stringify(manifest);
      const blob = new Blob([stringManifest], { type: 'application/json' });
      const manifestElem = document.getElementById('manifest-placeholder');
      if (manifestElem) manifestElem.setAttribute('href', URL.createObjectURL(blob));
    }

    async function applyModeAndFetch() {
      const controls = document.getElementById('schedule-controls');
      const status = getCurrentGroupStatus();
      const msg = getCurrentGroupMessage();

      if (status === 'канікули') {
        if (controls) controls.classList.add('hidden');
        renderVacationMode(msg);
        return;
      }

      if (status === 'практика') {
        if (controls) controls.classList.add('hidden');
        renderPracticeMode(msg);
        return;
      }

      if (status === 'сесія') {
        if (controls) controls.classList.add('hidden');
        await fetchSessionSchedule(currentGroup);
        return;
      }

      if (controls) controls.classList.remove('hidden');
      await fetchScheduleAndReplacements(currentGroup);
    }

    function renderVacationMode(msg) {
      const container = document.getElementById('schedule-container');
      container.innerHTML = `
        <div class="bg-gradient-to-br from-indigo-950/50 via-slate-800/80 to-blue-950/50 border border-blue-500/30 rounded-3xl p-8 text-center shadow-xl">
          <div class="w-16 h-16 bg-blue-500/20 text-blue-400 rounded-2xl flex items-center justify-center mx-auto text-3xl mb-4 shadow-inner">
            <i class="fa-solid fa-umbrella-beach"></i>
          </div>
          <h2 class="text-xl font-bold text-blue-200">Канікули!</h2>
          <p class="text-sm text-slate-300 mt-2.5 leading-relaxed max-w-md mx-auto whitespace-pre-wrap">
            ${msg || 'Наразі занять немає. Бажаємо гарного та продуктивного відпочинку!'}
          </p>
          <div class="mt-6 inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-xs text-slate-400">
            <span class="w-2 h-2 rounded-full bg-emerald-400"></span> Сповіщення призупинено
          </div>
        </div>
      `;
    }

    function renderPracticeMode(msg) {
      const container = document.getElementById('schedule-container');
      container.innerHTML = `
        <div class="bg-gradient-to-br from-amber-950/40 via-slate-800/90 to-orange-950/40 border border-amber-500/40 rounded-3xl p-6 sm:p-8 text-center shadow-xl">
          <div class="w-16 h-16 bg-amber-500/20 text-amber-400 rounded-2xl flex items-center justify-center mx-auto text-3xl mb-4 shadow-inner">
            <i class="fa-solid fa-helmet-safety"></i>
          </div>
          
          <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40 mb-3">
            Виробниче навчання та практика
          </span>
          
          <h2 class="text-xl font-bold text-slate-100">Період практики</h2>
          
          <p class="text-sm text-slate-300 mt-2.5 leading-relaxed max-w-md mx-auto whitespace-pre-wrap">
            ${msg || 'Зараз триває навчально-виробнича практика. Академічні пари за розкладом призупинено.'}
          </p>

          <div class="mt-6 pt-6 border-t border-slate-700/70 grid grid-cols-1 sm:grid-cols-2 gap-3 text-left">
            <div class="bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/60 flex items-start gap-3">
              <i class="fa-solid fa-book-open text-amber-400 mt-0.5"></i>
              <div class="text-xs">
                <p class="font-semibold text-slate-200">Щоденник практики</p>
                <p class="text-slate-400 mt-0.5">Своєчасно заповнюйте щоденник та звіти про виконані роботи.</p>
              </div>
            </div>

            <div class="bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/60 flex items-start gap-3">
              <i class="fa-solid fa-bell-slash text-slate-400 mt-0.5"></i>
              <div class="text-xs">
                <p class="font-semibold text-slate-200">Сповіщення вимкнено</p>
                <p class="text-slate-400 mt-0.5">Щоденні нагадування про пари призупинено на період практики.</p>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    async function fetchSessionSchedule(group) {
      const container = document.getElementById('schedule-container');
      container.innerHTML = `
        <div class="text-center py-12 text-slate-500">
          <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2"></i>
          <p>Завантаження розкладу сесії для ${group}...</p>
        </div>`;

      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent('Сесія')}&t=${Date.now()}`;
      
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("Аркуш 'Сесія' не знайдено");
        const text = await res.text();
        const rows = parseCsvSafe(text);

        sessionData = [];
        for (let i = 1; i < rows.length; i++) {
          const cols = rows[i];
          if (cols.length >= 5) {
            const grp = cols[1].trim();
            if (grp.toLowerCase() === group.toLowerCase()) {
              sessionData.push({
                date: cols[0].trim(),
                time: cols[2].trim(),
                type: cols[3].trim(),
                subject: cols[4].trim(),
                teacher: cols[5] ? cols[5].trim() : '',
                meet: cols[6] ? cols[6].trim() : '',
                room: cols[7] ? cols[7].trim() : ''
              });
            }
          }
        }

        renderSessionTimeline();
      } catch (e) {
        container.innerHTML = `
          <div class="bg-slate-800/60 border border-slate-700 rounded-2xl p-6 text-center text-slate-400">
            <i class="fa-solid fa-calendar-xmark text-3xl mb-2 text-slate-500"></i>
            <p class="font-medium text-slate-200">Розклад сесії поки відсутній</p>
            <p class="text-xs mt-1">Для вашої групи ще не внесено іспитів на аркуші «Сесія».</p>
          </div>`;
      }
    }

    function renderSessionTimeline() {
      const container = document.getElementById('schedule-container');

      if (sessionData.length === 0) {
        container.innerHTML = `
          <div class="bg-slate-800/60 border border-slate-700 rounded-2xl p-6 text-center text-slate-400">
            <i class="fa-solid fa-check-double text-3xl mb-2 text-emerald-400"></i>
            <p class="font-semibold text-slate-200">Усі заліки та іспити складено!</p>
            <p class="text-xs mt-1">Подій у розкладі сесії для цієї групи немає.</p>
          </div>`;
        return;
      }

      container.innerHTML = `
        <div class="mb-2 px-1 flex items-center justify-between text-xs text-amber-300 font-semibold">
          <span><i class="fa-solid fa-book-bookmark mr-1.5"></i> Екзаменаційна сесія</span>
          <span class="text-slate-400 font-normal">Усього подій: ${sessionData.length}</span>
        </div>
      ` + sessionData.map(item => {
        const hasMeet = item.meet && item.meet.startsWith('http');
        let typeBadge = 'bg-blue-500/20 text-blue-300 border-blue-500/40';
        let typeIcon = 'fa-solid fa-comments';
        const tLower = item.type.toLowerCase();

        if (tLower.includes('екзамен') || tLower.includes('іспит')) {
          typeBadge = 'bg-rose-500/20 text-rose-300 border-rose-500/40';
          typeIcon = 'fa-solid fa-file-signature';
        } else if (tLower.includes('залік')) {
          typeBadge = 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40';
          typeIcon = 'fa-solid fa-square-check';
        }

        return `
          <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-sm hover:border-slate-600 transition-all">
            <div class="flex items-center justify-between text-xs mb-2.5">
              <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full font-bold border ${typeBadge}">
                <i class="${typeIcon}"></i> ${item.type}
              </span>
              <div class="flex items-center gap-2 font-mono text-slate-300">
                <span class="bg-slate-700/60 px-2 py-0.5 rounded-md font-bold text-blue-300">${item.date}</span>
                <span><i class="fa-regular fa-clock mr-1"></i>${item.time}</span>
              </div>
            </div>

            <div class="mb-3">
              <h3 class="text-base font-bold text-slate-100">${item.subject}</h3>
              <div class="flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-400 mt-1.5">
                ${item.teacher ? `<span><i class="fa-solid fa-user-tie text-slate-500 mr-1"></i>${item.teacher}</span>` : ''}
                ${item.room ? `<span><i class="fa-solid fa-location-dot text-slate-500 mr-1"></i>${item.room}</span>` : ''}
              </div>
            </div>

            ${hasMeet ? `
              <a href="${item.meet}" target="_blank" rel="noopener noreferrer" 
                 class="w-full bg-blue-600 hover:bg-blue-500 active:scale-[0.98] transition-all text-white font-medium text-xs py-2 px-3 rounded-xl flex items-center justify-center gap-2 shadow-sm">
                <i class="fa-solid fa-video"></i> Увійти в Google Meet
              </a>` : ''
            }
          </div>
        `;
      }).join('');
    }

    async function fetchScheduleAndReplacements(group) {
      const container = document.getElementById('schedule-container');
      container.innerHTML = `
        <div class="text-center py-12 text-slate-500">
          <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2"></i>
          <p>Оновлення розкладу для ${group}...</p>
        </div>`;

      replacementsData = {};

      const replUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent('Заміни')}&t=${Date.now()}`;
      try {
        const replRes = await fetch(replUrl);
        if (replRes.ok) {
          const replCsv = await replRes.text();
          parseReplacementsCSV(replCsv, group);
        }
      } catch (e) {
        console.warn("Аркуш замін недоступний:", e);
      }

      const schedUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(group)}&t=${Date.now()}`;
      try {
        const res = await fetch(schedUrl);
        if (!res.ok) throw new Error("Помилка завантаження");
        const text = await res.text();
        scheduleData = parseAdaptiveCSV(text);
        renderAnnouncement();
        renderSchedule();
      } catch (err) {
        container.innerHTML = `
          <div class="bg-red-950/40 border border-red-500/30 p-4 rounded-xl text-center">
            <i class="fa-solid fa-triangle-exclamation text-red-400 text-2xl mb-2"></i>
            <p class="text-sm font-medium text-red-200">Помилка завантаження розкладу для "${group}"</p>
            <p class="text-xs text-red-300 mt-1">Перевірте назву аркуша в Google Таблиці.</p>
          </div>`;
      }
    }

    function parseCsvSafe(text) {
      const rows = [];
      let inQuotes = false;
      let curRow = [];
      let curVal = '';

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') {
          inQuotes = !inQuotes;
        } else if (c === ',' && !inQuotes) {
          curRow.push(curVal.trim());
          curVal = '';
        } else if ((c === '\n' || c === '\r') && !inQuotes) {
          if (c === '\r' && text[i + 1] === '\n') i++;
          curRow.push(curVal.trim());
          if (curRow.some(cell => cell.length > 0)) rows.push(curRow);
          curRow = [];
          curVal = '';
        } else {
          curVal += c;
        }
      }
      if (curVal.length > 0) curRow.push(curVal.trim());
      if (curRow.length > 0) rows.push(curRow);
      return rows;
    }

    function parseReplacementsCSV(text, targetGroup) {
      const rows = parseCsvSafe(text);
      rows.forEach(cols => {
        if (cols.length < 4) return;
        let rowDate = cols[0].replace(/^"|"$/g, '').trim();
        if (!rowDate || rowDate.toLowerCase().includes('дата')) return;

        if (rowDate.includes('.')) {
          const p = rowDate.split('.');
          if (p.length === 3) rowDate = `${p[2]}-${p[1].padStart(2, '0')}-${p[0].padStart(2, '0')}`;
        }

        const grp = cols[1].replace(/^"|"$/g, '').trim();
        const num = cols[2].replace(/^"|"$/g, '').trim();
        const status = cols[3].replace(/^"|"$/g, '').trim().toLowerCase();

        if (grp.toLowerCase() === targetGroup.toLowerCase()) {
          replacementsData[`${rowDate}_${num}`] = {
            status: status,
            subject: cols[4] ? cols[4].replace(/^"|"$/g, '').trim() : '',
            teacher: cols[5] ? cols[5].replace(/^"|"$/g, '').trim() : '',
            meet: cols[6] ? cols[6].replace(/^"|"$/g, '').trim() : '',
            room: cols[7] ? cols[7].replace(/^"|"$/g, '').trim() : ''
          };
        }
      });
    }

    function parseAdaptiveCSV(text) {
      const parsedRows = parseCsvSafe(text);
      if (parsedRows.length === 0) return [];

      currentAnnouncement = null;
      const rows = [];
      let scheduleHeaderIndex = -1;

      let msgText = '';
      let msgDate = '';

      for (let i = 0; i < parsedRows.length; i++) {
        const row = parsedRows[i];
        if (row[0] && row[0].toLowerCase().includes('оголошення')) {
          if (parsedRows[i + 1] && parsedRows[i + 1][0]) {
            msgText = parsedRows[i + 1][0];
          }
          const datePart = (parsedRows[i + 1] && parsedRows[i + 1][1]) ? parsedRows[i + 1][1] : '';
          const timePart = (parsedRows[i + 2] && parsedRows[i + 2][1]) ? parsedRows[i + 2][1] : '';
          msgDate = [datePart, timePart].filter(Boolean).join(' ');
          break;
        }
      }

      if (!msgText && parsedRows.length > 1) {
        if (parsedRows[1] && parsedRows[1].length > 9 && parsedRows[1][9]) {
          msgText = parsedRows[1][9];
          const datePart = parsedRows[1][10] || '';
          const timePart = (parsedRows[2] && parsedRows[2].length > 10) ? parsedRows[2][10] : '';
          msgDate = [datePart, timePart].filter(Boolean).join(' ');
        }
      }

      if (msgText && msgText.trim() !== '') {
        currentAnnouncement = { text: msgText.trim(), date: msgDate.trim() };
      }

      for (let i = 0; i < parsedRows.length; i++) {
        const row = parsedRows[i];
        const joined = row.join(' ').toLowerCase();
        if (joined.includes('день') && joined.includes('пара')) {
          scheduleHeaderIndex = i;
          break;
        }
      }

      if (scheduleHeaderIndex !== -1) {
        for (let i = scheduleHeaderIndex + 1; i < parsedRows.length; i++) {
          const cols = parsedRows[i];
          if (cols.length >= 5 && cols[0]) {
            const validDays = ['пн', 'вт', 'ср', 'чт', 'пт'];
            if (validDays.includes(cols[0].toLowerCase())) {
              rows.push({
                day: cols[0],
                num: cols[1],
                week: cols[2],
                time: cols[3],
                subject: cols[4],
                teacher: cols[5] || '',
                meet: cols[6] || '',
                room: cols[7] || ''
              });
            }
          }
        }
      }

      return rows;
    }

    function renderAnnouncement() {
      const card = document.getElementById('announcement-card');
      const textElem = document.getElementById('announcement-text');
      const dateElem = document.getElementById('announcement-date');

      if (!card) return;

      if (currentAnnouncement && currentAnnouncement.text) {
        textElem.textContent = currentAnnouncement.text;
        dateElem.textContent = currentAnnouncement.date ? `(${currentAnnouncement.date})` : '';
        card.classList.remove('hidden');
      } else {
        card.classList.add('hidden');
      }
    }

    const dismissBtn = document.getElementById('dismiss-announcement-btn');
    if (dismissBtn) {
      dismissBtn.onclick = () => {
        document.getElementById('announcement-card').classList.add('hidden');
      };
    }

    function renderSchedule() {
      const container = document.getElementById('schedule-container');

      const now = new Date();
      const currentDayOfWeek = now.getDay() || 7;
      const targetDayIndex = ['пн', 'вт', 'ср', 'чт', 'пт'].indexOf(currentDay.toLowerCase()) + 1;
      const targetDateObj = new Date(now);
      targetDateObj.setDate(now.getDate() + (targetDayIndex - currentDayOfWeek));
      const y = targetDateObj.getFullYear();
      const m = String(targetDateObj.getMonth() + 1).padStart(2, '0');
      const d = String(targetDateObj.getDate()).padStart(2, '0');
      const targetDateIso = `${y}-${m}-${d}`;

      const filtered = scheduleData.filter(item => {
        const matchDay = item.day.toLowerCase() === currentDay.toLowerCase();
        const matchWeek = item.week === 'Всі' || item.week == currentWeek || !item.week;
        return matchDay && matchWeek;
      }).sort((a, b) => parseInt(a.num) - parseInt(b.num));

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-slate-800/40 border border-slate-700/60 rounded-2xl p-8 text-center text-slate-400">
            <i class="fa-solid fa-mug-hot text-3xl mb-3 text-slate-500"></i>
            <p class="text-base font-semibold text-slate-300">Пар немає!</p>
            <p class="text-xs mt-1">На цей день занять не заплановано або у вас вихідний.</p>
          </div>`;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const isCurrent = isPairCurrent(item);
        const repl = replacementsData[`${targetDateIso}_${item.num}`];
        const isCancelled = repl && repl.status === 'скасовано';
        const isReplaced = repl && repl.status === 'заміна';

        const displaySubject = isReplaced ? repl.subject : item.subject;
        const displayTeacher = isReplaced ? (repl.teacher || item.teacher) : item.teacher;
        const displayMeet = isReplaced ? (repl.meet || item.meet) : item.meet;
        const displayRoom = isReplaced ? (repl.room || item.room) : item.room;
        const hasMeet = displayMeet && displayMeet.startsWith('http') && !isCancelled;

        let cardBorder = 'border-slate-700/80 hover:border-blue-500/50';
        if (isCancelled) {
          cardBorder = 'border-rose-900/40 bg-slate-800/40 opacity-75';
        } else if (isReplaced) {
          cardBorder = 'border-amber-500/80 bg-slate-800/95 shadow-lg shadow-amber-950/20';
        } else if (isCurrent) {
          cardBorder = 'active-pair-card border-2 ring-1 ring-emerald-500/50';
        }

        return `
          <div class="bg-slate-800 border ${cardBorder} rounded-2xl p-4 shadow-sm transition-all relative">
            <div class="flex items-center justify-between text-xs text-slate-400 mb-2">
              <div class="flex items-center gap-2">
                <span class="${isCurrent ? 'bg-emerald-600 text-white' : (isReplaced ? 'bg-amber-600 text-white' : 'bg-slate-700/80 text-blue-300')} font-bold px-2 py-0.5 rounded-md">
                  ${item.num} пара
                </span>

                ${isCancelled ? `
                  <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-rose-500/20 text-rose-300 border border-rose-500/40">
                    <i class="fa-solid fa-ban"></i> ПАРУ СКАСОВАНО
                  </span>
                ` : ''}

                ${isReplaced ? `
                  <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40">
                    <i class="fa-solid fa-arrows-rotate"></i> ЗАМІНА
                  </span>
                ` : ''}

                ${(isCurrent && !isCancelled) ? `
                  <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 animate-pulse">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Зараз триває
                  </span>
                ` : ''}
              </div>

              <span class="font-mono ${isCancelled ? 'line-through text-slate-500' : (isCurrent ? 'text-emerald-300 font-bold' : 'text-slate-300')}">
                <i class="fa-regular fa-clock mr-1"></i>${item.time}
              </span>
            </div>

            <div class="mb-3">
              ${isCancelled ? `
                <h3 class="text-base font-medium line-through text-slate-500">${item.subject}</h3>
                ${displaySubject ? `<p class="text-xs text-rose-400 mt-1"><i class="fa-solid fa-circle-info mr-1"></i>${displaySubject}</p>` : ''}
              ` : (isReplaced ? `
                <div class="text-xs text-slate-400 line-through mb-1">${item.subject} ${item.teacher ? `(${item.teacher})` : ''}</div>
                ${hasMeet 
                  ? `<a href="${displayMeet}" target="_blank" rel="noopener noreferrer" class="text-base font-bold text-amber-300 hover:text-amber-200 transition-colors flex items-center gap-1.5">
                       <span>${displaySubject}</span>
                       <i class="fa-solid fa-arrow-up-right-from-square text-xs opacity-70"></i>
                     </a>`
                  : `<h3 class="text-base font-bold text-amber-300">${displaySubject}</h3>`
                }
              ` : (hasMeet 
                ? `<a href="${displayMeet}" target="_blank" rel="noopener noreferrer" class="text-base font-bold ${isCurrent ? 'text-emerald-300 hover:text-emerald-200' : 'text-blue-400 hover:text-blue-300'} transition-colors flex items-center gap-1.5">
                     <span>${displaySubject}</span>
                     <i class="fa-solid fa-arrow-up-right-from-square text-xs opacity-70"></i>
                   </a>`
                : `<h3 class="text-base font-bold text-slate-200">${displaySubject}</h3>`
              ))}

              ${!isCancelled ? `
                <div class="flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-400 mt-1.5">
                  ${displayTeacher ? `<span><i class="fa-solid fa-user-tie text-slate-500 mr-1"></i>${displayTeacher}</span>` : ''}
                  ${displayRoom ? `<span><i class="fa-solid fa-location-dot text-slate-500 mr-1"></i>${displayRoom}</span>` : ''}
                </div>
              ` : ''}
            </div>

            ${hasMeet ? `
              <a href="${displayMeet}" target="_blank" rel="noopener noreferrer" 
                 class="w-full ${isCurrent ? 'bg-emerald-500 hover:bg-emerald-400 shadow-emerald-900/30' : (isReplaced ? 'bg-amber-600 hover:bg-amber-500' : 'bg-emerald-600 hover:bg-emerald-500')} active:scale-[0.98] transition-all text-white font-medium text-xs py-2.5 px-3 rounded-xl flex items-center justify-center gap-2 shadow-md">
                <i class="fa-solid fa-video"></i> Увійти в Google Meet
              </a>` : ''
            }
          </div>
        `;
      }).join('');
    }

    function renderDays() {
      const container = document.getElementById('days-container');
      if (!container) return;
      container.innerHTML = DAYS.map(d => `
        <button onclick="selectDay('${d.id}')" 
          class="py-2 rounded-xl text-xs font-semibold transition-all ${currentDay === d.id ? 'bg-blue-600 text-white shadow-md' : 'bg-slate-700/60 text-slate-300 hover:bg-slate-700'}">
          ${d.id}
        </button>
      `).join('');
    }

    function selectDay(day) {
      currentDay = day;
      renderDays();
      renderSchedule();
    }

    function setWeek(w) {
      currentWeek = w;
      const b1 = document.getElementById('week-1-btn');
      const b2 = document.getElementById('week-2-btn');
      if (b1 && b2) {
        if (w === 1) {
          b1.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg bg-blue-600 text-white shadow";
          b2.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white";
        } else {
          b2.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg bg-blue-600 text-white shadow";
          b1.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white";
        }
      }
      renderSchedule();
    }

    const notifyBtn = document.getElementById('notify-btn');
    function checkBellState() {
      if (!notifyBtn) return;
      if ("Notification" in window && Notification.permission === 'granted') {
        notifyBtn.innerHTML = '<i class="fa-solid fa-bell text-amber-400"></i>';
        notifyBtn.title = "Сповіщення увімкнено";
      } else {
        notifyBtn.innerHTML = '<i class="fa-regular fa-bell"></i>';
        notifyBtn.title = "Увімкнути сповіщення";
      }
    }

    if (notifyBtn) {
      notifyBtn.addEventListener('click', async () => {
        if (!("Notification" in window)) {
          alert("Ваш браузер не підтримує Push-сповіщення.");
          return;
        }

        if (window.OneSignal) {
          try {
            if (OneSignal.Notifications && OneSignal.Notifications.requestPermission) {
              await OneSignal.Notifications.requestPermission();
            } else if (OneSignal.Slidedown) {
              await OneSignal.Slidedown.promptPush();
            }
          } catch (e) {
            console.warn("OneSignal fallback:", e);
          }
        }

        if (Notification.permission !== 'granted' && Notification.permission !== 'denied') {
          await Notification.requestPermission();
        }

        if (Notification.permission === 'granted') {
          window.OneSignalDeferred = window.OneSignalDeferred || [];
          OneSignalDeferred.push(function(OneSignal) {
            OneSignal.User.addTag("group", currentGroup);
          });
        }

        checkBellState();
      });
    }

    const select = document.getElementById('group-select');
    if (select) {
      select.addEventListener('change', (e) => {
        currentGroup = e.target.value;
        localStorage.setItem('selected_group', currentGroup);
        if (window.OneSignal) OneSignal.User.addTag("group", currentGroup);
        updateManifest(currentGroup);
        applyModeAndFetch();
      });
    }

    const w1Btn = document.getElementById('week-1-btn');
    if (w1Btn) w1Btn.onclick = () => setWeek(1);

    const w2Btn = document.getElementById('week-2-btn');
    if (w2Btn) w2Btn.onclick = () => setWeek(2);

    const refBtn = document.getElementById('refresh-btn');
    if (refBtn) refBtn.onclick = () => loadGroupsAndMode();

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const banner = document.getElementById('install-banner');
      if (banner) banner.classList.remove('hidden');
      const text = document.getElementById('install-text');
      if (text) text.innerText = `Встановити «Мій розклад ${currentGroup}»`;
    });

    const instBtn = document.getElementById('install-btn');
    if (instBtn) {
      instBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          deferredPrompt = null;
          document.getElementById('install-banner').classList.add('hidden');
        }
      });
    }

    setInterval(() => {
      if (getCurrentGroupStatus() === 'навчання') renderSchedule();
    }, 30000);

    renderDays();
    checkBellState();
    loadGroupsAndMode();
  </script>
</body>
</html>
