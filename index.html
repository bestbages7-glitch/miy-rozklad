<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Мій розклад</title>
  <meta name="theme-color" content="#1e293b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link id="manifest-placeholder" rel="manifest">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .announcement-box {
      animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Навігаційна панель -->
  <header class="bg-slate-800/90 backdrop-blur sticky top-0 z-30 border-b border-slate-700 px-4 py-3 shadow-md">
    <div class="max-w-2xl mx-auto flex items-center justify-between gap-2">
      <div>
        <h1 id="app-title" class="text-base sm:text-lg font-bold text-blue-400 flex items-center gap-2">
          <i class="fa-solid fa-graduation-cap"></i> Розклад
        </h1>
        <p id="group-subtitle" class="text-xs text-slate-400">Оберіть групу</p>
      </div>
      
      <div class="flex items-center gap-1.5 sm:gap-2">
        <!-- Кнопка нагадувань (Push за 1 хв) -->
        <button id="notify-btn" title="Увімкнути сповіщення" class="p-2 text-slate-400 hover:text-white bg-slate-700/60 rounded-lg transition-colors">
          <i class="fa-regular fa-bell"></i>
        </button>

        <!-- Вибір групи -->
        <select id="group-select" class="bg-slate-700 border border-slate-600 text-xs sm:text-sm rounded-lg px-2 py-1.5 focus:ring-2 focus:ring-blue-500 focus:outline-none max-w-[145px] sm:max-w-none">
          <!-- Заповнюється автоматично -->
        </select>

        <!-- Кнопка оновлення -->
        <button id="refresh-btn" title="Оновити розклад" class="p-2 text-slate-400 hover:text-white bg-slate-700/60 rounded-lg transition-colors">
          <i class="fa-solid fa-arrows-rotate"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto w-full p-4 flex-1 flex flex-col gap-4">

    <!-- БЛОК: Важливе повідомлення від старости (J2 текст, K2 дата, K3 час) -->
    <div id="announcement-card" class="hidden announcement-box bg-gradient-to-r from-amber-500/20 via-orange-500/20 to-red-500/20 border-l-4 border-amber-500 bg-slate-800/95 rounded-2xl p-4 shadow-lg">
      <div class="flex items-start justify-between gap-3">
        <div class="flex items-start gap-3">
          <div class="w-9 h-9 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center shrink-0 text-lg mt-0.5">
            <i class="fa-solid fa-triangle-exclamation"></i>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h2 class="text-sm sm:text-base font-bold text-amber-300">Важливе повідомлення</h2>
              <span id="announcement-date" class="text-[11px] text-slate-400"></span>
            </div>
            <p id="announcement-text" class="text-xs sm:text-sm text-slate-200 mt-1.5 whitespace-pre-wrap leading-relaxed"></p>
          </div>
        </div>
        <button id="dismiss-announcement-btn" title="Приховати" class="text-slate-400 hover:text-slate-200 p-1 text-sm transition-colors">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <!-- Банер встановлення як додатка (PWA) -->
    <div id="install-banner" class="hidden bg-blue-900/40 border border-blue-500/40 rounded-xl p-3 flex items-center justify-between gap-3 text-xs sm:text-sm">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-mobile-screen-button text-blue-400 text-lg"></i>
        <span id="install-text">Встановіть «Мій розклад» на головний екран!</span>
      </div>
      <button id="install-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-3 py-1.5 rounded-lg whitespace-nowrap transition-colors">
        Додати
      </button>
    </div>

    <!-- Перемикач тижня (Чисельник / Знаменник) та днів -->
    <div class="bg-slate-800/80 p-3 rounded-2xl border border-slate-700 shadow-sm flex flex-col gap-3">
      <div class="flex items-center justify-between bg-slate-900/70 p-1 rounded-xl">
        <button id="week-1-btn" class="flex-1 py-1.5 text-xs font-semibold rounded-lg transition-colors text-slate-400">
          I тиждень (Чисельник)
        </button>
        <button id="week-2-btn" class="flex-1 py-1.5 text-xs font-semibold rounded-lg transition-colors text-slate-400">
          II тиждень (Знаменник)
        </button>
      </div>

      <div class="grid grid-cols-5 gap-1.5" id="days-container">
        <!-- Кнопки днів генеруються автоматично -->
      </div>
    </div>

    <!-- Список занять -->
    <div id="schedule-container" class="flex flex-col gap-3">
      <div class="text-center py-12 text-slate-500">
        <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2"></i>
        <p>Завантаження розкладу...</p>
      </div>
    </div>
  </main>

  <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-800">
    Синхронізовано з Google Таблицею • Сповіщення за 1 хв до дзвінка
  </footer>

  <script>
    // ================= НАЛАШТУВАННЯ =================
    // Вшитий ідентифікатор вашої Google Таблиці
    const SHEET_ID = '1igLEwYbzJ_ucINolekByzD_wL7pAnU-nDCbSiUciSMA';

    // Список груп коледжу
    const GROUPS = [
      'БС-5.203к', 'БС-5.201', 'БС-5.202к', 'БС-6.101', 'БС-6.102к',
      'БС-6.103к', 'БС-6.104к', 'СТ-6.105', 'СТ-6.106к', 'СТ-6.107к',
      'МН-6.108к', 'МН-6.109к', 'СТ-5.205', 'СТ-5.206к', 'СТ-5.207к',
      'МН-5.208к', 'МН-5.209к', 'ЕМ-6.110', 'ЕМ-6.111к', 'ТМ-6.112',
      'ХТ-6.113', 'ТМ-6.114к', 'ТМ-6.115к', 'ТР-6.116к', 'ТР-6.117к',
      'ЕМ-5.210', 'ЕМ-5.211к', 'ТМ-5.212', 'ХТ-5.213', 'ТМ-5.214к',
      'ТМ-5.215к', 'ТР-5.216', 'ТР-5.217к'
    ];

    // Початок семестру для підрахунку парності
    const SEMESTER_START_DATE = '2026-09-01T00:00:00';
    // ================================================

    const DAYS = [
      { id: 'Пн', name: 'Понеділок' },
      { id: 'Вт', name: 'Вівторок' },
      { id: 'Ср', name: 'Середа' },
      { id: 'Чт', name: 'Четвер' },
      { id: 'Пт', name: "П'ятниця" }
    ];

    let currentGroup = localStorage.getItem('selected_group') || 'БС-5.203к';
    let currentDay = getInitialDay();
    let currentWeek = getInitialWeek();
    let scheduleData = [];
    let currentAnnouncement = null;
    let deferredPrompt;
    let notificationsEnabled = localStorage.getItem('notifications_enabled') === 'true';

    function getInitialDay() {
      const d = new Date().getDay();
      return (d >= 1 && d <= 5) ? DAYS[d - 1].id : 'Пн';
    }

    function getInitialWeek() {
      const semesterStart = new Date(SEMEESTER_START_DATE = typeof SEMESTER_START_DATE !== 'undefined' ? SEMESTER_START_DATE : '2026-09-01T00:00:00');
      const now = new Date();
      if (now < semesterStart) return 1;

      const diffInDays = Math.floor((now - semesterStart) / (1000 * 60 * 60 * 24));
      const weekNumber = Math.floor(diffInDays / 7) + 1;
      return (weekNumber % 2 === 0) ? 2 : 1;
    }

    function updateManifest(groupName) {
      const title = `Мій розклад ${groupName}`;
      document.title = title;
      document.getElementById('app-title').innerHTML = `<i class="fa-solid fa-graduation-cap"></i> ${title}`;
      document.getElementById('group-subtitle').textContent = `Група: ${groupName}`;

      const manifest = {
        name: title,
        short_name: groupName,
        start_url: window.location.href.split('?')[0] + `?group=${encodeURIComponent(groupName)}`,
        display: "standalone",
        background_color: "#0f172a",
        theme_color: "#1e293b",
        icons: [
          {
            src: "https://cdn-icons-png.flaticon.com/512/2997/2997295.png",
            sizes: "512x512",
            type: "image/png",
            purpose: "any maskable"
          }
        ]
      };
      const stringManifest = JSON.stringify(manifest);
      const blob = new Blob([stringManifest], { type: 'application/json' });
      document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(blob));
    }

    // Завантаження розкладу з Google Таблиць
    async function fetchSchedule(group) {
      const container = document.getElementById('schedule-container');
      container.innerHTML = `
        <div class="text-center py-12 text-slate-500">
          <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2"></i>
          <p>Оновлення розкладу для ${group}...</p>
        </div>`;

      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(group)}&t=${Date.now()}`;
      
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("Помилка завантаження аркуша");
        const text = await res.text();
        scheduleData = parseAdaptiveCSV(text);
        renderAnnouncement();
        renderSchedule();
        checkUpcomingClasses();
      } catch (err) {
        container.innerHTML = `
          <div class="bg-red-950/40 border border-red-500/30 p-4 rounded-xl text-center">
            <i class="fa-solid fa-triangle-exclamation text-red-400 text-2xl mb-2"></i>
            <p class="text-sm font-medium text-red-200">Помилка завантаження розкладу для "${group}"</p>
            <p class="text-xs text-red-300 mt-1">Переконайтеся, що таблицю опубліковано в інтернеті та назва аркуша збігається.</p>
          </div>`;
      }
    }

    // Повний адаптивний парсер під J2 (оголошення) та K2, K3 (дата і час)
    function parseAdaptiveCSV(text) {
      const rawLines = text.trim().split(/\r?\n/);
      if (rawLines.length === 0) return [];

      currentAnnouncement = null;
      const rows = [];
      let scheduleHeaderIndex = -1;

      // Коректне розбиття на стовпчики з урахуванням лапок
      const parsedRows = rawLines.map(line => {
        const cols = [];
        let inQuotes = false;
        let token = '';
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            cols.push(token.trim());
            token = '';
          } else {
            token += char;
          }
        }
        cols.push(token.trim());
        return cols;
      });

      // ================= 1. ПОШУК ОГОЛОШЕННЯ (J2 та K2, K3) =================
      let msgText = '';
      let msgDate = '';

      // Варіант 1: Окремий заголовок "Оголошення"
      for (let i = 0; i < parsedRows.length; i++) {
        const row = parsedRows[i];
        if (row[0] && row[0].toLowerCase().includes('оголошення')) {
          if (parsedRows[i + 1] && parsedRows[i + 1][0]) {
            msgText = parsedRows[i + 1][0];
          }
          const datePart = (parsedRows[i + 1] && parsedRows[i + 1][1]) ? parsedRows[i + 1][1] : '';
          const timePart = (parsedRows[i + 2] && parsedRows[i + 2][1]) ? parsedRows[i + 2][1] : '';
          msgDate = [datePart, timePart].filter(Boolean).join(' ');
          break;
        }
      }

      // Варіант 2: Стовпчик J (індекс 9) та стовпчик K (індекс 10)
      if (!msgText && parsedRows.length > 1) {
        if (parsedRows[1] && parsedRows[1].length > 9 && parsedRows[1][9]) {
          msgText = parsedRows[1][9];
          const datePart = parsedRows[1][10] || '';
          const timePart = (parsedRows[2] && parsedRows[2].length > 10) ? parsedRows[2][10] : '';
          msgDate = [datePart, timePart].filter(Boolean).join(' ');
        }
      }

      if (msgText && msgText.trim() !== '') {
        currentAnnouncement = {
          text: msgText.trim(),
          date: msgDate.trim()
        };
      }

      // ================= 2. ПОШУК РОЗКЛАДУ ПАР =================
      for (let i = 0; i < parsedRows.length; i++) {
        const row = parsedRows[i];
        const joined = row.join(' ').toLowerCase();
        if (joined.includes('день') && joined.includes('пара')) {
          scheduleHeaderIndex = i;
          break;
        }
      }

      if (scheduleHeaderIndex !== -1) {
        for (let i = scheduleHeaderIndex + 1; i < parsedRows.length; i++) {
          const cols = parsedRows[i];
          if (cols.length >= 5 && cols[0]) {
            const validDays = ['пн', 'вт', 'ср', 'чт', 'пт'];
            if (validDays.includes(cols[0].toLowerCase())) {
              rows.push({
                day: cols[0],
                num: cols[1],
                week: cols[2], // Всі, 1, 2
                time: cols[3],
                subject: cols[4],
                teacher: cols[5] || '',
                meet: cols[6] || '',
                room: cols[7] || ''
              });
            }
          }
        }
      }

      return rows;
    }

    function renderAnnouncement() {
      const card = document.getElementById('announcement-card');
      const textElem = document.getElementById('announcement-text');
      const dateElem = document.getElementById('announcement-date');

      if (currentAnnouncement && currentAnnouncement.text) {
        textElem.textContent = currentAnnouncement.text;
        dateElem.textContent = currentAnnouncement.date ? `(${currentAnnouncement.date})` : '';
        card.classList.remove('hidden');
      } else {
        card.classList.add('hidden');
      }
    }

    document.getElementById('dismiss-announcement-btn').onclick = () => {
      document.getElementById('announcement-card').classList.add('hidden');
    };

    function renderSchedule() {
      const container = document.getElementById('schedule-container');
      const filtered = scheduleData.filter(item => {
        const matchDay = item.day.toLowerCase() === currentDay.toLowerCase();
        const matchWeek = item.week === 'Всі' || item.week == currentWeek || !item.week;
        return matchDay && matchWeek;
      }).sort((a, b) => parseInt(a.num) - parseInt(b.num));

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-slate-800/40 border border-slate-700/60 rounded-2xl p-8 text-center text-slate-400">
            <i class="fa-solid fa-mug-hot text-3xl mb-3 text-slate-500"></i>
            <p class="text-base font-semibold text-slate-300">Пар немає!</p>
            <p class="text-xs mt-1">На цей день занять не заплановано або у вас вихідний.</p>
          </div>`;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const hasMeet = item.meet && item.meet.startsWith('http');
        return `
          <div class="bg-slate-800 border border-slate-700/80 rounded-2xl p-4 shadow-sm hover:border-blue-500/50 transition-colors">
            <div class="flex items-center justify-between text-xs text-slate-400 mb-2">
              <span class="bg-slate-700/80 text-blue-300 font-bold px-2 py-0.5 rounded-md">${item.num} пара</span>
              <span class="font-mono text-slate-300"><i class="fa-regular fa-clock mr-1"></i>${item.time}</span>
            </div>

            <div class="mb-3">
              ${hasMeet 
                ? `<a href="${item.meet}" target="_blank" rel="noopener noreferrer" class="text-base font-bold text-blue-400 hover:text-blue-300 transition-colors flex items-center gap-1.5">
                     <span>${item.subject}</span>
                     <i class="fa-solid fa-arrow-up-right-from-square text-xs opacity-70"></i>
                   </a>`
                : `<h3 class="text-base font-bold text-slate-200">${item.subject}</h3>`
              }
              <div class="flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-400 mt-1.5">
                ${item.teacher ? `<span><i class="fa-solid fa-user-tie text-slate-500 mr-1"></i>${item.teacher}</span>` : ''}
                ${item.room ? `<span><i class="fa-solid fa-location-dot text-slate-500 mr-1"></i>${item.room}</span>` : ''}
              </div>
            </div>

            ${hasMeet ? `
              <a href="${item.meet}" target="_blank" rel="noopener noreferrer" 
                 class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-[0.98] transition-all text-white font-medium text-xs py-2 px-3 rounded-xl flex items-center justify-center gap-2 shadow-sm">
                <i class="fa-solid fa-video"></i> Увійти в Google Meet
              </a>` : ''
            }
          </div>
        `;
      }).join('');
    }

    function renderDays() {
      const container = document.getElementById('days-container');
      container.innerHTML = DAYS.map(d => `
        <button onclick="selectDay('${d.id}')" 
          class="py-2 rounded-xl text-xs font-semibold transition-all ${currentDay === d.id ? 'bg-blue-600 text-white shadow-md' : 'bg-slate-700/60 text-slate-300 hover:bg-slate-700'}">
          ${d.id}
        </button>
      `).join('');
    }

    function selectDay(day) {
      currentDay = day;
      renderDays();
      renderSchedule();
    }

    function setWeek(w) {
      currentWeek = w;
      const b1 = document.getElementById('week-1-btn');
      const b2 = document.getElementById('week-2-btn');
      if (w === 1) {
        b1.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg bg-blue-600 text-white shadow";
        b2.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white";
      } else {
        b2.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg bg-blue-600 text-white shadow";
        b1.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-white";
      }
      renderSchedule();
    }

// ================= ПУШ-СПОВІЩЕННЯ ТА SERVICE WORKER =================
    const notifyBtn = document.getElementById('notify-btn');
    let swRegistration = null;

    // Реєстрація inline Service Worker для Android Chrome
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('notificationclick', function(event) {
          event.notification.close();
          event.waitUntil(
            clients.matchAll({ type: 'window' }).then(function(clientList) {
              if (event.notification.data && event.notification.data.url) {
                return clients.openWindow(event.notification.data.url);
              }
            })
          );
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob))
        .then(reg => { swRegistration = reg; })
        .catch(() => {});
    }

    function updateNotifyBtnUI() {
      if (notificationsEnabled && ("Notification" in window) && Notification.permission === 'granted') {
        notifyBtn.innerHTML = '<i class="fa-solid fa-bell text-amber-400"></i>';
        notifyBtn.title = "Сповіщення увімкнено (натисніть для перевірки)";
      } else {
        notifyBtn.innerHTML = '<i class="fa-regular fa-bell"></i>';
        notifyBtn.title = "Увімкнути сповіщення";
      }
    }

    // Звуковий сигнал через Web Audio (без зовнішніх файлів)
    function playBeep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.15); // A5
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } catch (e) {}
    }

    // Універсальний показ пушу (працює і на ПК, і на смартфонах)
    async function showMobilePush(title, bodyText, meetUrl) {
      playBeep();
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);

      // 1. Спроба через Service Worker (єдиний робочий метод на Android)
      if (swRegistration && swRegistration.showNotification) {
        try {
          await swRegistration.showNotification(title, {
            body: bodyText,
            icon: "https://cdn-icons-png.flaticon.com/512/2997/2997295.png",
            vibrate: [200, 100, 200],
            data: { url: meetUrl },
            requireInteraction: true
          });
          return;
        } catch (e) {}
      }

      // 2. Спроба через стандартний Notification (для ПК / Safari)
      try {
        const notif = new Notification(title, {
          body: bodyText,
          icon: "https://cdn-icons-png.flaticon.com/512/2997/2997295.png"
        });
        notif.onclick = () => {
          window.focus();
          if (meetUrl) window.open(meetUrl, '_blank');
        };
      } catch (e) {}
    }

    notifyBtn.addEventListener('click', async () => {
      if (!("Notification" in window)) {
        alert("Ваш браузер не підтримує сповіщення.");
        return;
      }

      if (Notification.permission === 'granted') {
        notificationsEnabled = true;
        localStorage.setItem('notifications_enabled', 'true');
        updateNotifyBtnUI();
        // Відправляємо миттєвий тестовий пуш
        showMobilePush("🔔 Тест сповіщень", "Сповіщення працюють відмінно! За 1 хв до пари прийде нагадування.", "");
      } else if (Notification.permission !== 'denied') {
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          notificationsEnabled = true;
          localStorage.setItem('notifications_enabled', 'true');
          updateNotifyBtnUI();
          showMobilePush("🔔 Сповіщення активовано", "За 1 хвилину до пари ви отримаєте нагадування.", "");
        }
      } else {
        alert("Сповіщення заблоковано в налаштуваннях браузера. Надайте дозвіл для цього сайту.");
      }
    });

    // Перевірка часу щосекунди для точного спрацьовування
    function checkUpcomingClasses() {
      if (!notificationsEnabled || Notification.permission !== 'granted') return;

      const now = new Date();
      const dayIndex = now.getDay();
      if (dayIndex === 0 || dayIndex === 6) return;

      const currentDayId = DAYS[dayIndex - 1].id;
      const currentSecondsTotal = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

      const todayClasses = scheduleData.filter(item => {
        const matchDay = item.day.toLowerCase() === currentDayId.toLowerCase();
        const matchWeek = item.week === 'Всі' || item.week == currentWeek || !item.week;
        return matchDay && matchWeek;
      });

      todayClasses.forEach(item => {
        if (!item.time) return;

        const startTimeStr = item.time.split('-')[0].trim();
        const parts = startTimeStr.split(':').map(Number);
        if (parts.length < 2 || isNaN(parts[0]) || isNaN(parts[1])) return;

        const classStartSeconds = parts[0] * 3600 + parts[1] * 60;
        const diffSeconds = classStartSeconds - currentSecondsTotal;

        // Спрацьовує у проміжку від 60 до 5 секунд до початку
        if (diffSeconds <= 60 && diffSeconds > 0) {
          const notifKey = `notified_${currentGroup}_${item.num}_${now.toDateString()}_${parts[0]}_${parts[1]}`;
          
          if (!sessionStorage.getItem(notifKey)) {
            sessionStorage.setItem(notifKey, 'true');

            showMobilePush(
              `🔔 За 1 хв пара: ${item.subject}`,
              `${item.time} | ${item.teacher || 'Викладач'}\nНатисніть для підключення`,
              (item.meet && item.meet.startsWith('http')) ? item.meet : ''
            );
          }
        }
      });
    }

    // Запускаємо перевірку кожні 5 секунд замість 30
    setInterval(checkUpcomingClasses, 5000);

    // ================= ІНІЦІАЛІЗАЦІЯ СТОРІНКИ =================
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('group') && GROUPS.includes(urlParams.get('group'))) {
      currentGroup = urlParams.get('group');
    }

    const select = document.getElementById('group-select');
    select.innerHTML = GROUPS.map(g => `<option value="${g}" ${g === currentGroup ? 'selected' : ''}>${g}</option>`).join('');
    
    select.addEventListener('change', (e) => {
      currentGroup = e.target.value;
      localStorage.setItem('selected_group', currentGroup);
      updateManifest(currentGroup);
      fetchSchedule(currentGroup);
    });

    document.getElementById('week-1-btn').onclick = () => setWeek(1);
    document.getElementById('week-2-btn').onclick = () => setWeek(2);
    document.getElementById('refresh-btn').onclick = () => fetchSchedule(currentGroup);

    // Встановлення PWA
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('install-banner').classList.remove('hidden');
      document.getElementById('install-text').innerText = `Встановити «Мій розклад ${currentGroup}»`;
    });

    document.getElementById('install-btn').addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
        document.getElementById('install-banner').classList.add('hidden');
      }
    });

    // Перший запуск
    renderDays();
    setWeek(currentWeek);
    updateNotifyBtnUI();
    updateManifest(currentGroup);
    fetchSchedule(currentGroup);
  </script>
</body>
</html>
